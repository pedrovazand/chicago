services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: chicago
      POSTGRES_DB: chicago
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Execute npm run db:setup primeiro}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/001-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chicago -d chicago"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
